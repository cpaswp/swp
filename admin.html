<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن | إدارة البرامج</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <header class="bg-gray-900 text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">لوحة تحكم الإدارة (الأدمن)</h1>
            <a href="index.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold">عرض الموقع الرئيسي</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- نموذج إضافة منتج جديد -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <h2 class="text-xl font-bold text-gray-900 mb-4 pb-2 border-b">إضافة برنامج أو منتج جديد</h2>
            <form id="product-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">اسم البرنامج</label>
                    <input type="text" id="name" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">اختر صورة البرنامج من جهازك</label>
                    <input type="file" id="image_file" accept="image/*" class="w-full border rounded-lg p-2 bg-gray-50 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium mb-1">وصف مختصر (يظهر في البطاقة الرئيسية)</label>
                    <input type="text" id="short_desc" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">سعر الكاش</label>
                    <input type="text" id="cash_price" placeholder="مثال: 5000 جنيه" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">خطة التقسيط</label>
                    <input type="text" id="installment_plan" placeholder="مثال: مقدم 50% والباقي على 3 شهور" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium mb-1">الشرح التفصيلي والمميزات</label>
                    <textarea id="features" rows="4" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="اكتب مميزات وتفاصيل البرنامج هنا..."></textarea>
                </div>
                
                <!-- زر الحفظ والإضافة -->
                <div class="md:col-span-2 mt-4">
                    <button type="submit" style="background-color: #16a34a; color: #ffffff !important;" class="w-full hover:bg-green-700 font-extrabold py-4 px-6 rounded-xl transition shadow-lg text-center cursor-pointer text-lg flex items-center justify-center gap-2">
                        <i class="fas fa-plus-circle"></i> حفظ وإضافة البرنامج للموقع
                    </button>
                </div>
            </form>
        </div>

        <!-- قائمة البرامج الحالية للحذف أو المتابعة -->
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold text-gray-900 mb-4 pb-2 border-b">البرامج الحالية في النظام</h2>
            <div id="admin-products-list" class="space-y-4">
                <!-- يتم تحميل المنتجات هنا -->
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://ukvvxiiokanxkmqudqhe.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_MkaOKmxctRyVZTgPdeVWSw_fjZzqNex';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadAdminProducts() {
            const { data, error } = await supabaseClient.from('products').select('*');
            const listContainer = document.getElementById('admin-products-list');
            listContainer.innerHTML = '';

            if (error || !data || data.length === 0) {
                listContainer.innerHTML = `<p class="text-gray-500 text-center py-4">لا توجد برامج مضافة حتى الآن.</p>`;
                return;
            }

            data.forEach(p => {
                listContainer.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3">
                            <img src="${p.image_url || 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=100&auto=format&fit=crop&q=80'}" class="w-12 h-12 object-cover rounded-lg shadow-sm">
                            <div>
                                <h3 class="font-bold text-lg text-gray-900">${p.name}</h3>
                                <p class="text-sm text-gray-600">كاش: ${p.cash_price || 'غير محدد'} | تقسيط: ${p.installment_plan || 'غير محدد'}</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct(${p.id})" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm transition cursor-pointer font-bold">
                            <i class="fas fa-trash ml-1"></i> حذف
                        </button>
                    </div>
                `;
            });
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const short_desc = document.getElementById('short_desc').value;
            const cash_price = document.getElementById('cash_price').value;
            const installment_plan = document.getElementById('installment_plan').value;
            const features = document.getElementById('features').value;
            const imageFile = document.getElementById('image_file').files[0];

            let imageUrl = 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600&auto=format&fit=crop&q=80';

            // إذا اخترت صورة من جهازك، تأكد أنك قمت بإنشاء Storage Bucket في Supabase باسم product-images وجعلته Public
            if (imageFile) {
                const fileName = `product_${Date.now()}_${imageFile.name}`;
                const { data: uploadData, error: uploadError } = await supabaseClient.storage
                    .from('product-images')
                    .upload(fileName, imageFile);

                if (uploadError) {
                    alert('ملاحظة: لرفع الصور مباشرة من الجهاز، أنشئ Storage Bucket في Supabase باسم "product-images" واجعله Public. سيتم استخدام الصورة الافتراضية مؤقتاً.');
                } else {
                    const { data: publicURLData } = supabaseClient.storage
                        .from('product-images')
                        .getPublicUrl(fileName);
                    imageUrl = publicURLData.publicUrl;
                }
            }

            const newProduct = {
                name,
                image_url: imageUrl,
                short_desc,
                cash_price,
                installment_plan,
                features,
                full_desc: features
            };

            const { error } = await supabaseClient.from('products').insert([newProduct]);

            if (error) {
                alert('حدث خطأ أثناء الإضافة: ' + error.message);
            } else {
                alert('تم إضافة البرنامج بنجاح!');
                document.getElementById('product-form').reset();
                loadAdminProducts();
            }
        });

        async function deleteProduct(id) {
            if (!confirm('هل أنت متأكد من رغبتك في حذف هذا البرنامج؟')) return;

            const { error } = await supabaseClient.from('products').delete().eq('id', id);
            if (error) {
                alert('خطأ أثناء الحذف: ' + error.message);
            } else {
                loadAdminProducts();
            }
        }

        loadAdminProducts();
    </script>
</body>
</html>
